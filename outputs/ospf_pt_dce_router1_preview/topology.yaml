schema_version: '1.0'
status: ready
name: ospf_triangle_ecmp
source: model_generated
intent: 三台 2911 路由器构成三角拓扑，Router0 与 Router1 之间同时存在串口直连和经 Router2 的以太网绕行，全部接口运行 OSPF
  进程 100、area 0；验证两台 PC 双向互通、PC0→Router0→Router2→Router1→PC1 的低代价路径、Router0 学习到的远端
  OSPF 路由，以及 Router2 到 30.0.0.0/30 的两个等价下一跳 10.0.0.1 和 20.0.0.1。
assumptions:
- OSPF 使用默认度量：GigabitEthernet 代价 1，Serial（默认带宽 1544 kbps）代价 64，因此 PC0→Router0→Router2→Router1（累计代价
  1+1+1=3）优于 Router0 串口直连 Router1（代价 1+64=65）。
- Router2 到 30.0.0.0/30 有两条等价路径：经 G0/0 下一跳 10.0.0.1 与经 G0/1 下一跳 20.0.0.1，代价均为 1+64=65，形成等价多路径。
- 实测 PT 工程的串口 DCE 位于 Router1 S0/0/0；保留现有 clock rate 2000000，Router0 为 DTE。
- 两台 PC 的 IPv4 地址与默认网关在 Packet Tracer GUI 中配置：PC0=192.168.16.1/25、网关 192.168.16.126（Router0
  G0/0）；PC1=192.168.16.129/26、网关 192.168.16.190（Router1 G0/0）。
- 192.168.16.0/25 与 192.168.16.128/26 属于两个不重叠的广播域，OSPF 为无类路由协议，可正确通告 VLSM 子网。
- 首次 ping 可能因 ARP 解析丢弃首个报文，该现象需保留记录；应在预热 ping 之后再执行下列断言，验收阈值不因 ARP 或模型不确定性降低。
devices:
- name: Router0
  kind: router
  model: '2911'
  interfaces:
  - name: GigabitEthernet0/0
    mode: routed
    ipv4: 192.168.16.126/25
    enabled: true
  - name: GigabitEthernet0/1
    mode: routed
    ipv4: 10.0.0.1/30
    enabled: true
  - name: Serial0/0/0
    mode: routed
    ipv4: 30.0.0.1/30
    enabled: true
  routing:
    ospf:
      process_id: 100
      router_id: 1.1.1.1
      networks:
      - prefix: 192.168.16.0/25
        area: 0
      - prefix: 10.0.0.0/30
        area: 0
      - prefix: 30.0.0.0/30
        area: 0
- name: Router1
  kind: router
  model: '2911'
  interfaces:
  - name: GigabitEthernet0/0
    mode: routed
    ipv4: 192.168.16.190/26
    enabled: true
  - name: GigabitEthernet0/1
    mode: routed
    ipv4: 20.0.0.1/30
    enabled: true
  - name: Serial0/0/0
    mode: routed
    ipv4: 30.0.0.2/30
    enabled: true
    clock_rate: 2000000
  routing:
    ospf:
      process_id: 100
      router_id: 2.2.2.2
      networks:
      - prefix: 192.168.16.128/26
        area: 0
      - prefix: 20.0.0.0/30
        area: 0
      - prefix: 30.0.0.0/30
        area: 0
- name: Router2
  kind: router
  model: '2911'
  interfaces:
  - name: GigabitEthernet0/0
    mode: routed
    ipv4: 10.0.0.2/30
    enabled: true
  - name: GigabitEthernet0/1
    mode: routed
    ipv4: 20.0.0.2/30
    enabled: true
  routing:
    ospf:
      process_id: 100
      router_id: 3.3.3.3
      networks:
      - prefix: 10.0.0.0/30
        area: 0
      - prefix: 20.0.0.0/30
        area: 0
- name: PC0
  kind: pc
  model: PC-PT
  gateway: 192.168.16.126
  interfaces:
  - name: FastEthernet0
    mode: routed
    ipv4: 192.168.16.1/25
    enabled: true
- name: PC1
  kind: pc
  model: PC-PT
  gateway: 192.168.16.190
  interfaces:
  - name: FastEthernet0
    mode: routed
    ipv4: 192.168.16.129/26
    enabled: true
links:
- a:
    device: PC0
    interface: FastEthernet0
  b:
    device: Router0
    interface: GigabitEthernet0/0
  medium: copper
- a:
    device: PC1
    interface: FastEthernet0
  b:
    device: Router1
    interface: GigabitEthernet0/0
  medium: copper
- a:
    device: Router0
    interface: GigabitEthernet0/1
  b:
    device: Router2
    interface: GigabitEthernet0/0
  medium: copper
- a:
    device: Router2
    interface: GigabitEthernet0/1
  b:
