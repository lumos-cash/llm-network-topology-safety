enable
configure terminal
hostname Router2
interface GigabitEthernet0/0
ip address 10.0.0.2 255.255.255.252
no shutdown
exit
interface GigabitEthernet0/1
ip address 20.0.0.2 255.255.255.252
no shutdown
exit
router ospf 100
router-id 3.3.3.3
network 10.0.0.0 0.0.0.3 area 0
network 20.0.0.0 0.0.0.3 area 0
exit
end
